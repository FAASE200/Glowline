name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (WPF + pruebas)
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pruebas de LyricGlow.Core
        run: dotnet run --project LyricGlow.Core.Tests/LyricGlow.Core.Tests.csproj -c Release

      - name: Compilar la app de Windows
        run: dotnet build LyricGlow/LyricGlow.csproj -c Release

      - name: Publicar build portable
        if: github.ref == 'refs/heads/main'
        run: >
          dotnet publish LyricGlow/LyricGlow.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Subir artefacto
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Glowline-portable-win-x64
          path: publish/LyricGlow.exe
          retention-days: 14
