name: Release

# When main gets a new version (Glowline.csproj) or its release notes
# (docs/release-notes/<version>.md), this builds the Windows installer and the
# portable app and creates a DRAFT GitHub release v<version>. GitHub creates
# the tag when the draft is published, which is a manual step: the in-app
# updater only offers a build after someone has checked it.
# Versions that are already published are skipped.

on:
  push:
    branches: [main]
    paths:
      - Glowline/Glowline.csproj
      - docs/release-notes/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and draft release
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content Glowline/Glowline.csproj
          $version = [string]@($project.Project.PropertyGroup.Version)[0]
          "TAG=v$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          $notes = "docs/release-notes/$version.md"
          "notes=$notes" >> $env:GITHUB_OUTPUT

          # A published release is never rebuilt; a missing notes file means
          # the version isn't ready to be released yet.
          $published = $false
          $existing = gh release view "v$version" --json isDraft 2>$null | ConvertFrom-Json
          if ($existing -and -not $existing.isDraft) { $published = $true }
          $ready = (Test-Path $notes) -and -not $published
          if (-not (Test-Path $notes)) { Write-Host "No $notes yet: skipping release." }
          if ($published) { Write-Host "v$version is already published: skipping release." }
          "ready=$ready".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          # "gh release view" fails when the release doesn't exist yet; that's expected.
          $global:LASTEXITCODE = 0

      - name: Test Glowline.Core
        if: steps.version.outputs.ready == 'true'
        run: dotnet run --project Glowline.Core.Tests/Glowline.Core.Tests.csproj -c Release

      - name: Publish the Windows app
        if: steps.version.outputs.ready == 'true'
        run: >
          dotnet publish Glowline/Glowline.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o Glowline/publish

      - name: Install WiX 5
        if: steps.version.outputs.ready == 'true'
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2

      - name: Build installers
        if: steps.version.outputs.ready == 'true'
        shell: pwsh
        run: ./Glowline/tools/build-installers.ps1 -Version ${{ steps.version.outputs.version }} -PublishDir "$PWD/Glowline/publish"

      - name: Publish the 0.9.30 bridge
        if: steps.version.outputs.ready == 'true'
        run: dotnet publish Glowline.Bridge/Glowline.Bridge.csproj -c Release -o bridge-out

      - name: Collect release assets
        if: steps.version.outputs.ready == 'true'
        id: assets
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $out = New-Item -ItemType Directory -Force release-assets
          Copy-Item "Glowline/publish/GlowlineSetup-$version.exe" $out
          Copy-Item "Glowline/publish/Glowline.exe" (Join-Path $out "Glowline-$version-portable.exe")
          # 0.9.30 only reads the latest release and only installs this file
          # name. It gets the bridge, which installs this Glowline version.
          Copy-Item bridge-out/GlowlineBridge.exe (Join-Path $out "LyricGlowSetup-$version.exe")
          Get-ChildItem $out | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "{0,-36} {1}" -f $_.Name, $hash
          } | Tee-Object -FilePath hashes.txt

      - name: Create draft release
        if: steps.version.outputs.ready == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $notes = Get-Content "${{ steps.version.outputs.notes }}" -Raw -Encoding UTF8
          $hashes = Get-Content hashes.txt -Raw
          $body = "$notes`n### SHA-256`n`n``````text`n$hashes``````"
          Set-Content release-body.md $body -Encoding UTF8
          $title = if (([version]$version).Major -lt 1) { "$env:TAG Alpha" } else { "Glowline $env:TAG" }

          # Re-running replaces an earlier draft of the same version, but never
          # touches a release that has already been published.
          $existing = gh release view $env:TAG --json isDraft 2>$null | ConvertFrom-Json
          if ($existing) {
            gh release delete $env:TAG --yes
          }

          gh release create $env:TAG --draft --target $env:GITHUB_SHA --title $title `
            --notes-file release-body.md (Get-ChildItem release-assets).FullName
