name: Release

# Pushing a release/<version> branch builds the Windows installer and the
# portable app and creates a DRAFT GitHub release v<version> with the notes
# from docs/release-notes/<version>.md. GitHub creates the tag when the draft
# is published, which is a manual step: the in-app updater only offers a build
# after someone has checked it.

on:
  push:
    branches: ['release/**']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and draft release
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content LyricGlow/LyricGlow.csproj
          $version = [string]@($project.Project.PropertyGroup.Version)[0]
          $branch = "${{ github.ref_name }}"
          if ($branch -ne "release/$version") { throw "Branch $branch does not match project version $version" }
          "TAG=v$version" >> $env:GITHUB_ENV
          $notes = "docs/release-notes/$version.md"
          if (-not (Test-Path $notes)) { throw "Missing $notes" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT

      - name: Test LyricGlow.Core
        run: dotnet run --project LyricGlow.Core.Tests/LyricGlow.Core.Tests.csproj -c Release

      - name: Publish the Windows app
        run: >
          dotnet publish LyricGlow/LyricGlow.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o LyricGlow/publish

      - name: Install WiX 5
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2

      - name: Build installers
        shell: pwsh
        run: ./LyricGlow/tools/build-installers.ps1 -Version ${{ steps.version.outputs.version }} -PublishDir "$PWD/LyricGlow/publish"

      - name: Collect release assets
        id: assets
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $out = New-Item -ItemType Directory -Force release-assets
          Copy-Item "LyricGlow/publish/LyricGlowSetup-$version.exe" $out
          Copy-Item "LyricGlow/publish/LyricGlow.exe" (Join-Path $out "Glowline-$version-portable.exe")
          Get-ChildItem $out | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "{0,-36} {1}" -f $_.Name, $hash
          } | Tee-Object -FilePath hashes.txt

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $notes = Get-Content "${{ steps.version.outputs.notes }}" -Raw -Encoding UTF8
          $hashes = Get-Content hashes.txt -Raw
          $body = "$notes`n### SHA-256`n`n``````text`n$hashes``````"
          Set-Content release-body.md $body -Encoding UTF8
          $title = if (([version]$version).Major -lt 1) { "$env:TAG Alpha" } else { "Glowline $env:TAG" }

          # Re-running replaces an earlier draft of the same version, but never
          # touches a release that has already been published.
          $existing = gh release view $env:TAG --json isDraft 2>$null | ConvertFrom-Json
          if ($existing) {
            if (-not $existing.isDraft) { throw "$env:TAG is already published; bump the version instead." }
            gh release delete $env:TAG --yes
          }

          gh release create $env:TAG --draft --target $env:GITHUB_SHA --title $title `
            --notes-file release-body.md (Get-ChildItem release-assets).FullName
